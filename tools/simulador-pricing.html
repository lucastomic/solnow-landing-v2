<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolNow · Simulador de pricing</title>
<!--
  Simulador de pricing de SolNow, en un solo fichero.

  Es el gemelo de /es/calculator del sitio, portado a HTML plano para poder
  abrirlo desde Obsidian (o desde cualquier sitio) sin servidor, sin build y sin
  red: no carga ni una fuente ni un script de fuera.

  Fuente de verdad de las cifras: `Pricing v1` en el vault. Si esto y las notas
  discrepan, mandan las notas. Todo lo editable vive en el bloque DATOS.
-->
<style>
:root{
  --bg:#f7f7f7; --surface:#fff; --surface-2:#f1f4f8; --line:#d8e0e8; --line-soft:#e6ebf1;
  --fg:#083954; --fg-2:#1f4d6b; --muted:#5a7a91; --muted-2:#8aa1b3;
  --accent:#106695; --accent-2:#4A90C0; --accent-dim:#083954; --accent-bg:rgba(16,102,149,.10);
  --warn:#d98a1a; --ok:#1f9d6b;
  --cost-bank:#c0392b; --cost-human:#7d5ba6;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 64px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.lede{color:var(--muted);font-size:14px;margin:0 0 26px}
.grid{display:grid;grid-template-columns:372px minmax(0,1fr);gap:32px;align-items:start}
@media(max-width:1000px){.grid{grid-template-columns:1fr;gap:22px}.panel{position:static!important}}
.panel{position:sticky;top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 0 rgba(8,57,84,.04),0 4px 12px -6px rgba(8,57,84,.06)}
.pad{padding:22px}
.stack{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
.sub{font-size:13px;color:var(--fg-2);margin:4px 0 0}
.foot{font-size:11.5px;line-height:1.5;color:var(--muted-2);margin:0}

/* Controles */
label.f{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.fname{font-size:14px;font-weight:500}
.fval{font-family:var(--mono);font-size:13.5px;color:var(--accent);font-weight:600;white-space:nowrap}
.hint{font-size:12px;line-height:1.45;color:var(--muted);margin:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--fill,50%),var(--line) var(--fill,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--fill,50%),var(--line) var(--fill,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 2px 6px -1px rgba(8,57,84,.28)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 2px 6px -1px rgba(8,57,84,.28)}
.seg{display:grid;gap:4px;padding:4px;background:var(--surface-2);border-radius:99px;border:1px solid var(--line-soft)}
.seg button{padding:9px 8px;border:0;border-radius:99px;background:none;font:inherit;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:background .16s,color .16s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(8,57,84,.1)}
details>summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--fg-2)}
details.pricing>summary{color:var(--accent)}
.divider{border-top:1px solid var(--line-soft);padding-top:18px}
input[type=number]{width:100%;min-width:0;padding:7px 8px;font-family:var(--mono);font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px}
.prow{display:grid;gap:8px;align-items:center}
.plabel{font-size:12px;color:var(--muted);line-height:1.3}
.psuffix{font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.btn{padding:7px 14px;border:1px solid var(--line);background:var(--surface);border-radius:99px;font:inherit;font-size:12.5px;color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.chk{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
.chk input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

/* Propuesta */
.proposals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;align-items:start}
.prop-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.prop-total{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums}
.prop-per{font-size:12px;color:var(--muted)}
ul.prop{list-style:none;margin:14px 0 0;padding:0}
ul.prop li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.dot{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block;transform:translateY(1px)}
.rate{font-family:var(--mono);font-size:12.5px;text-align:right;font-weight:600;color:var(--accent)}
.rate.free{color:var(--ok)}
.nm{color:var(--fg-2)}
.nm.free{color:var(--muted)}

/* Leyenda */
.legend{display:flex;flex-wrap:wrap;gap:6px 10px}
.legend button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:11.5px;color:var(--fg-2);background:none;border:1px solid transparent;border-radius:99px;padding:4px 9px 4px 7px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.legend button:hover{background:var(--surface-2);border-color:var(--line)}
.legend button[data-off=true]{color:var(--muted-2);text-decoration:line-through}
.legend button[data-off=true] .dot{background:transparent!important;border:1px dashed var(--muted-2)}

/* Comparativa */
.vs-row{display:grid;grid-template-columns:112px minmax(0,1fr) 96px;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line-soft)}
.vs-row:first-child{border-top:0}
.vs-row[data-solnow=true]{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent);border-radius:0 8px 8px 0;padding-left:10px;margin-left:-10px}
.vs-name{font-size:13.5px;color:var(--fg-2)}
.vs-row[data-solnow=true] .vs-name{color:var(--accent);font-weight:600}
.vs-bar{display:flex;height:34px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.seg-bar{min-width:0;display:flex;align-items:center;padding:0 7px;font-size:10.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.seg-bar[data-external=true]{box-shadow:inset 1px 0 0 rgba(255,255,255,.55),inset -1px 0 0 rgba(255,255,255,.55)}
.vs-total{font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vs-caps{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 12px}
.cap{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;white-space:nowrap;color:var(--fg-2)}
.cap[data-on=false]{color:var(--muted-2);text-decoration:line-through;opacity:.75}
@media(max-width:640px){
  .vs-row{grid-template-columns:minmax(0,1fr) auto}
  .vs-row>.vs-name{grid-column:1}
  .vs-row>.vs-total{grid-column:2;grid-row:1}
  .vs-row>.vs-bar{grid-column:1/3;grid-row:2}
  .vs-caps{grid-column:1/3;grid-row:3}
}

/* Desglose */
.bd-bar{display:flex;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.bd-seg{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 12px;color:#fff;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;border-top:1px solid var(--line-soft)}
thead th{padding:8px 12px;border:0;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tbody th{text-align:left;font-weight:600}
td{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tfoot th,tfoot td{border-top:2px solid var(--line)}
tr.free th,tr.free td{color:var(--muted-2)}

/* Calendario */
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:168px}
.mcol{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.mbar{border-radius:4px 4px 0 0;min-height:3px}
.mlabels{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:8px}
.mlabel{text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
.mlabel.free{color:var(--accent)}
@media(max-width:560px){.months{height:130px;gap:3px}.mlabels{gap:3px}}

.warn{padding:10px 13px;border-radius:8px;background:rgba(200,74,58,.08);border:1px solid rgba(200,74,58,.3);color:#8f2f22;font-size:13px}
.note{padding:9px 12px;border-radius:8px;background:var(--accent-bg);font-size:12.5px;color:var(--fg-2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Simulador de pricing</h1>
  <p class="lede">SolNow · las cifras salen de <code>Pricing v1</code>. Todo lo que muevas se queda en la URL.</p>
  <div class="grid">
    <div class="panel"><div class="card pad stack" id="controls"></div></div>
    <div class="stack" id="results"></div>
  </div>
</div>
<script>
'use strict';

/* ═══════════════ DATOS · lo único que hay que tocar para cambiar precios ═══ */

const FIXED  = { monthly:{first:199, extra:99}, season:{first:1590, extra:790} };
const SEASON_MONTHS = [2,3,4,5,6,7,8,9];            // marzo–octubre
const RATES  = {
  manual:  {pct:0,     perBooking:0},
  card:    {pct:0.01,  perBooking:0.2},             // fuera de la escalera: es la pasarela
  online:  {pct:0.02,  perBooking:0},
  whatsapp:{pct:0.04,  perBooking:0},
  otas:    {pct:0.02,  perBooking:0},
};
const COMMISSION_MIN = 0.2;                          // por reserva comisionable, solo en escalones > 0%

const CHANNEL_ORDER = ['online','otas','card','manual','whatsapp'];
const CHANNEL_LABEL = {manual:'Manual y efectivo', card:'Tarjeta física', online:'Web y motor', whatsapp:'WhatsApp', otas:'OTAs'};
const CAPABILITIES  = [{key:'online',label:'Web y motor'},{key:'otas',label:'OTAs'},{key:'card',label:'Cobro con tarjeta'},{key:'whatsapp',label:'WhatsApp con IA'}];
const SOLNOW_COVERS = {online:true, otas:true, card:true, whatsapp:true};

// Un canal que la plataforma no cubre no sale gratis: lo cubre otro y cobra.
const FALLBACK = {card:'bank', whatsapp:'human'};

const NO = {manual:0, card:0, online:0, whatsapp:0, otas:0};
const COMPETITORS = [
  {key:'fareharbor', name:'FareHarbor', monthlyFee:0,   perBooking:0,    pct:{...NO, online:.06,   otas:.02},
   covers:{card:false,whatsapp:false,online:true,otas:true}, note:'6% online + 2% OTAs · sin cuota'},
  {key:'regiondo',   name:'Regiondo',   monthlyFee:99,  perBooking:0.49, pct:{...NO, online:.025,  otas:.025},
   covers:{card:false,whatsapp:false,online:true,otas:true}, note:'99 €/mes + 0,49 €/reserva + 2,5% online y OTAs'},
  {key:'turitop',    name:'TuriTop',    monthlyFee:299, perBooking:0,    pct:{...NO, online:.0075, otas:.0075},
   covers:{card:false,whatsapp:false,online:true,otas:true}, note:'299 €/mes + 0,75% de comisión'},
  {key:'bokun',      name:'Bókun',      monthlyFee:499, perBooking:0,    pct:{...NO, online:.01,   otas:.01},
   covers:{card:false,whatsapp:false,online:true,otas:true}, note:'499 €/mes + 1% de las reservas aplicables'},
  {key:'checkfront', name:'Checkfront', monthlyFee:99,  perBooking:0,    pct:{...NO, online:.03},
   covers:{card:false,whatsapp:false,online:true,otas:true}, note:'99 €/mes + 3% de las reservas online'},
  {key:'peek',       name:'Peek Pro',   monthlyFee:0,   perBooking:0,    pct:{...NO, online:.06},
   covers:{card:false,whatsapp:false,online:true,otas:true},
   note:'6% de las reservas online · sin cuota · puede repercutirse al viajero. Cobra además su propia pasarela: 2,3% + 0,30 €/ticket'},
];

const SEASONALITY = {
  mediterraneo:{label:'Mediterráneo', hint:'Pico en julio y agosto, invierno parado.',
    curve:[.01,.01,.02,.05,.08,.13,.22,.26,.13,.06,.02,.01]},
  canarias:{label:'Todo el año', hint:'Canarias y destinos de invierno: temporada larga y sin parón.',
    curve:[.07,.07,.08,.08,.08,.09,.11,.12,.09,.08,.07,.06]},
  flat:{label:'Plana', hint:'Mismo volumen todos los meses. Útil para comparar sin ruido.',
    curve:Array.from({length:12},()=>1/12)},
};
const MONTHS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

const R = {                                          // rangos de los controles
  revenue:{min:100000,max:5000000,step:50000,init:800000},
  bases:{min:1,max:12,step:1,init:2},
  presencial:{min:0,max:100,step:1,init:65},
  card:{min:0,max:100,step:5,init:70},
  whatsapp:{min:0,max:60,step:1,init:8},
  otas:{min:0,max:50,step:1,init:10},
  ticket:{min:15,max:400,step:1,init:141},
  bank:{min:0,max:3,step:.1,init:.9},
  human:{min:0,max:40,step:.1,init:11.7},
};

const LINE_COLOR = {fixed:'var(--accent-dim)', online:'var(--accent)', otas:'var(--accent-2)',
  card:'var(--warn)', manual:'var(--muted-2)', whatsapp:'var(--ok)',
  bank:'var(--cost-bank)', human:'var(--cost-human)'};
const LEGEND_LABEL = {fixed:'Cuota fija', online:'Web y motor', otas:'OTAs', card:'Tarjeta física',
  manual:'Manual y efectivo', bank:'Tu banco', whatsapp:'WhatsApp', human:'Atender WhatsApp a mano'};
const LEGEND_ORDER = ['fixed','online','otas','card','manual','bank','whatsapp','human'];
const EXTERNAL = new Set(['bank','human']);

/* ═══════════════ FORMATO ═══════════════ */

const eur   = new Intl.NumberFormat('es-ES',{maximumFractionDigits:0, useGrouping:true});
const cents = new Intl.NumberFormat('es-ES',{minimumFractionDigits:2, maximumFractionDigits:2});
const pct1  = new Intl.NumberFormat('es-ES',{minimumFractionDigits:1, maximumFractionDigits:1});
// Las tarifas llevan hasta dos decimales: con uno, un 0,75% se leía «0,8%».
const rateF = new Intl.NumberFormat('es-ES',{minimumFractionDigits:0, maximumFractionDigits:2});

const money = v => eur.format(Math.round(v)) + ' €';
const unit  = v => (Number.isInteger(v) ? eur.format(v) : cents.format(v)) + ' €';
const pc    = v => pct1.format(v*100) + '%';
const pc100 = v => pct1.format(v) + '%';
const rate  = v => rateF.format(v*100) + '%';
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const snap  = (v,r) => clamp(Math.round(v/r.step)*r.step, r.min, r.max);
const sum   = ls => ls.reduce((a,l)=>a+l.amount, 0);

/* ═══════════════ LOS CINCO CANALES ═══════════════ */

/* El visitante mueve tres —presencial, WhatsApp y OTAs— y `online` es el resto.
   Lo presencial se parte en dos canales de verdad: `card` paga el 1% + 0,20 € y
   `manual` no paga nada. Son tarifas distintas, así que son filas distintas. */
function channels(i){
  const p = clamp(i.presencial,0,100);
  let w = clamp(i.whatsapp,0,100), o = clamp(i.otas,0,100);
  const excess = p + w + o - 100;
  if (excess > 0){
    const others = w + o;
    if (others > 0){ w = Math.round(w - excess*w/others); o = Math.round(o - excess*o/others); }
    const drift = p + w + o - 100;
    if (drift) { if (w >= o) w = Math.max(0, w-drift); else o = Math.max(0, o-drift); }
  }
  const card = p * clamp(i.card,0,100) / 100;
  return {manual:p-card, card, whatsapp:w, otas:o, online:Math.max(0, 100-p-w-o)};
}
const presencialShare = ch => ch.manual + ch.card;

/* ═══════════════ EL CÁLCULO ═══════════════ */

const fixedRate = (bases, billing, pricing) => {
  const r = pricing.fixed[billing === 'season' ? 'season' : 'monthly'];
  return r.first + r.extra * (Math.max(1,bases) - 1);
};
const fixedAnnual = (bases, billing, pricing) =>
  billing === 'season' ? fixedRate(bases,'season',pricing) : fixedRate(bases,'monthly',pricing)*12;

function integrityError(pricing){
  for (const b of [R.bases.min, R.bases.max])
    if (fixedRate(b,'season',pricing) >= fixedRate(b,'monthly',pricing)*12)
      return `Con ${b} base(s), la tarifa anual no es más barata que doce mensualidades.`;
  for (const k of Object.keys(SEASONALITY)){
    const t = SEASONALITY[k].curve.reduce((a,b)=>a+b,0);
    if (Math.abs(t-1) > .005) return `El perfil «${k}» suma ${(t*100).toFixed(1)}% en vez de 100%.`;
  }
  const m = pricing.rates.manual.pct;
  if (CHANNEL_ORDER.some(k => k!=='manual' && pricing.rates[k].pct < m))
    return 'Lo que se apunta a mano no es el canal más barato: vender más a mano subiría el precio.';
  return null;
}

/* La tarifa de repuesto de cada canal, con los importes que pone el visitante. */
const fallbackRates = i => ({
  bank:  {name:'Tu banco',                 rate:{pct:clamp(i.bank,0,100)/100, perBooking:0}},
  human: {name:'Atender WhatsApp a mano',  rate:{pct:0, perBooking:Math.max(0,i.human)}},
});

/* Quién cobra este canal y a qué precio. Si la plataforma no lo cubre, el canal
   no sale gratis: la tarjeta la cobra su banco y el WhatsApp lo atiende alguien. */
function chargeFor(key, spec){
  const isCap = CAPABILITIES.some(c => c.key === key);
  if (!isCap || spec.covers[key]) return {key, name:CHANNEL_LABEL[key], rate:spec.rates[key]};
  const fb = FALLBACK[key];
  if (!fb) return {key, name:CHANNEL_LABEL[key], rate:null};
  return {key:fb, name:spec.fallback[fb].name, rate:spec.fallback[fb].rate};
}

function rateLabel(r, min, ticket){
  // Con tickets pequeños el mínimo manda sobre el porcentaje anunciado, y decir
  // «2%» cuando se cobran 0,20 € por reserva sería falso.
  if (min > 0 && ticket > 0 && r.pct > 0 && ticket*r.pct < min) return `mín. ${unit(min)}/reserva`;
  const parts = [];
  if (r.pct > 0)        parts.push(rate(r.pct));
  if (r.perBooking > 0) parts.push(`${unit(r.perBooking)}/reserva`);
  return parts.join(' + ') || '0%';
}

/* `max(importe × %, mínimo)` por reserva, y solo en escalones > 0%: una reserva
   al 0% no es comisionable, así que tampoco tiene mínimo. */
function channelAmount(base, bookings, r, min, ticket){
  const p = (r.pct <= 0 || min <= 0 || ticket <= 0)
    ? base * r.pct
    : bookings * Math.max(ticket*r.pct, min);
  return p + bookings*r.perBooking;
}

function costLines(rev, spec, ticket){
  const out = [];
  if (spec.monthlyFee > 0)
    out.push({key:'fixed', name:'Cuota fija', rate:`${money(spec.monthlyFee)}/mes`, base:null, amount:spec.monthlyFee*12});
  for (const key of CHANNEL_ORDER){
    const c = chargeFor(key, spec), base = rev[key], bookings = ticket > 0 ? base/ticket : 0;
    out.push({
      key: c.key, name: c.name, channel: key, base,
      rate:   c.rate ? rateLabel(c.rate, spec.min || 0, ticket) : 'no lo cubre',
      amount: c.rate ? channelAmount(base, bookings, c.rate, spec.min || 0, ticket) : 0,
    });
  }
  return out;
}

function computeQuote(i, hidden = []){
  const inputs = {...i,
    revenue:snap(i.revenue,R.revenue), bases:snap(i.bases,R.bases),
    ticket:snap(i.ticket,R.ticket), card:snap(i.card,R.card),
    bank:snap(i.bank,R.bank), human:snap(i.human,R.human)};
  const ch = channels(inputs);
  const rev = Object.fromEntries(CHANNEL_ORDER.map(k => [k, inputs.revenue*ch[k]/100]));
  const bookings = inputs.ticket > 0 ? inputs.revenue/inputs.ticket : 0;

  const all = costLines(rev, {monthlyFee:0, rates:inputs.pricing.rates, covers:SOLNOW_COVERS,
    min:inputs.pricing.min, fallback:fallbackRates(inputs)}, inputs.ticket);

  const showFixed = !hidden.includes('fixed');
  const shown = all.filter(l => !hidden.includes(l.key));
  const fixed = fixedAnnual(inputs.bases, inputs.billing, inputs.pricing);
  const lines = [];
  if (showFixed) lines.push({key:'fixed', name:'Cuota fija', base:null, amount:fixed,
    rate: inputs.billing === 'season'
      ? `${money(fixedRate(inputs.bases,'season',inputs.pricing))}/año`
      : `${money(fixedRate(inputs.bases,'monthly',inputs.pricing))}/mes`});
  lines.push(...shown);

  const shownFixed = showFixed ? fixed : 0;
  const variable = sum(shown);
  const total = shownFixed + variable;
  return {inputs, channels:ch, rev, bookings, lines, fixed:shownFixed, total,
    effectiveRate: inputs.revenue > 0 ? total/inputs.revenue : 0,
    schedule: schedule(inputs, inputs.revenue > 0 ? variable/inputs.revenue : 0, showFixed)};
}

function schedule(i, variableRate, showFixed){
  const seasonMonthly = fixedRate(i.bases,'season',i.pricing)/SEASON_MONTHS.length;
  const monthly = fixedRate(i.bases,'monthly',i.pricing);
  return SEASONALITY[i.seasonality].curve.map((w, m) => {
    const charged = showFixed && (i.billing === 'monthly' || SEASON_MONTHS.includes(m));
    const f = !charged ? 0 : (i.billing === 'season' ? seasonMonthly : monthly);
    const v = i.revenue * w * variableRate;
    return {label:MONTHS[m], fixed:f, variable:v, total:f+v, free:!charged};
  });
}

const PROPOSAL_LABELS = ['A','B'];

function alternatives(quotes, hidden = []){
  const q0 = quotes[0], i = q0.inputs, fb = fallbackRates(i);
  const caps = covers => CAPABILITIES.map(c => ({...c, on:covers[c.key]}));

  const rivals = COMPETITORS.map(c => {
    const rates = Object.fromEntries(CHANNEL_ORDER.map(k => [k, {pct:c.pct[k]||0, perBooking:c.perBooking}]));
    const lines = costLines(q0.rev, {monthlyFee:c.monthlyFee, rates, covers:c.covers, fallback:fb}, i.ticket);
    return {key:c.key, name:c.name, total:sum(lines), lines, capabilities:caps(c.covers), note:c.note, isSolnow:false};
  });

  const ours = quotes.map((q, n) => ({
    key: n === 0 ? 'solnow' : 'solnow-B',
    name: quotes.length > 1 ? `SolNow · ${PROPOSAL_LABELS[n]}` : 'SolNow',
    total:q.total, lines:q.lines, capabilities:caps(SOLNOW_COVERS),
    note: quotes.length > 1 ? `Propuesta ${PROPOSAL_LABELS[n]}` : 'Tu resultado', isSolnow:true,
  }));

  const rows = [...ours, ...rivals].map(r => {
    const lines = r.lines.filter(l => !hidden.includes(l.key));
    return {...r, lines, total:sum(lines)};
  });
  return rows.sort((a,b) => a.total - b.total);
}

/* ═══════════════ ESTADO ═══════════════ */

const clonePricing = () => ({
  fixed:{monthly:{...FIXED.monthly}, season:{...FIXED.season}},
  rates:Object.fromEntries(CHANNEL_ORDER.map(k => [k, {...RATES[k]}])),
  min:COMMISSION_MIN,
});

const DEFAULTS = {
  revenue:R.revenue.init, bases:R.bases.init, presencial:R.presencial.init, card:R.card.init,
  whatsapp:R.whatsapp.init, otas:R.otas.init, billing:'season', ticket:R.ticket.init,
  bank:R.bank.init, human:R.human.init, seasonality:'mediterraneo',
  pricing:clonePricing(), pricingB:null,
};

// Los once números de una propuesta, en orden fijo, para la URL.
const PFIELDS = [
  ['fijo','1ª base · mensual','€/mes',1,   p=>p.fixed.monthly.first,  (p,v)=>({...p,fixed:{...p.fixed,monthly:{...p.fixed.monthly,first:v}}})],
  ['fijo','Adicional · mensual','€/mes',1, p=>p.fixed.monthly.extra,  (p,v)=>({...p,fixed:{...p.fixed,monthly:{...p.fixed.monthly,extra:v}}})],
  ['fijo','1ª base · anual','€/año',10,    p=>p.fixed.season.first,   (p,v)=>({...p,fixed:{...p.fixed,season:{...p.fixed.season,first:v}}})],
  ['fijo','Adicional · anual','€/año',10,  p=>p.fixed.season.extra,   (p,v)=>({...p,fixed:{...p.fixed,season:{...p.fixed.season,extra:v}}})],
  ...['manual','card','online','otas','whatsapp'].map(k => ['escalera', CHANNEL_LABEL[k], '%', .05,
      p => Math.round(p.rates[k].pct*10000)/100,
      (p,v) => ({...p, rates:{...p.rates, [k]:{...p.rates[k], pct:v/100}}})]),
  ['escalera','Tarjeta · fijo por operación','€',.05, p=>p.rates.card.perBooking,
      (p,v)=>({...p, rates:{...p.rates, card:{...p.rates.card, perBooking:v}}})],
  ['escalera','Mínimo por reserva','€',.05, p=>p.min, (p,v)=>({...p, min:v})],
];

const encodePricing = p => PFIELDS.map(f => f[4](p)).join('_');
function decodePricing(raw){
  const d = clonePricing();
  if (!raw) return d;
  const n = raw.split('_').map(Number);
  return PFIELDS.reduce((p, f, k) =>
    (Number.isFinite(n[k]) && n[k] >= 0) ? f[5](p, n[k]) : p, d);
}
const isDefaultPricing = p => PFIELDS.every(f => f[4](p) === f[4](DEFAULTS.pricing));

function toQuery(i){
  const ch = channels(i);
  const q = {f:i.revenue, b:i.bases, m:presencialShare(ch), w:ch.whatsapp, o:ch.otas,
    p:i.billing === 'season' ? 'temp' : 'mes', t:i.ticket, k:i.card, n:i.bank, h:i.human, s:i.seasonality};
  if (!isDefaultPricing(i.pricing)) q.pr = encodePricing(i.pricing);
  if (i.pricingB) q.prb = encodePricing(i.pricingB);
  return new URLSearchParams(q).toString();
}

function fromQuery(search){
  const p = new URLSearchParams(search);
  const num = (k, d) => { const r = (p.get(k)||'').trim(); if (!r) return d;
    const v = Number(r); return Number.isFinite(v) ? v : d; };
  const base = {
    revenue:snap(num('f',DEFAULTS.revenue),R.revenue), bases:snap(num('b',DEFAULTS.bases),R.bases),
    presencial:clamp(num('m',DEFAULTS.presencial),0,100),
    whatsapp:clamp(num('w',DEFAULTS.whatsapp),0,100), otas:clamp(num('o',DEFAULTS.otas),0,100),
    billing:p.get('p') === 'mes' ? 'monthly' : 'season',
    ticket:snap(num('t',DEFAULTS.ticket),R.ticket), card:snap(num('k',DEFAULTS.card),R.card),
    bank:snap(num('n',DEFAULTS.bank),R.bank), human:snap(num('h',DEFAULTS.human),R.human),
    seasonality:SEASONALITY[p.get('s')] ? p.get('s') : DEFAULTS.seasonality,
    pricing:decodePricing(p.get('pr')),
    pricingB:p.get('prb') ? decodePricing(p.get('prb')) : null,
  };
  const ch = channels(base);
  return {...base, presencial:presencialShare(ch), whatsapp:ch.whatsapp, otas:ch.otas};
}

let state  = (() => {
  try { return fromQuery(location.search); } catch { return {...DEFAULTS}; }
})();
let hidden = [];
let shown  = 0;

function set(patch){
  state = {...state, ...patch};
  const ch = channels(state);
  state.presencial = presencialShare(ch); state.whatsapp = ch.whatsapp; state.otas = ch.otas;
  syncUrl();
  render();
}

/* Vuelca la configuración a la barra de direcciones, si es que hay una.
   Dentro de Obsidian la página vive en un `iframe.srcdoc`, cuyo origen es
   `about:srcdoc`: ahí `replaceState` lanza una SecurityError y, como esto se
   llama en cada movimiento de deslizador, tumbaría el simulador al primer
   clic. Sin URL que actualizar simplemente no se actualiza; todo lo demás
   funciona igual. */
function syncUrl(){
  try { history.replaceState(null, '', location.pathname + '?' + toQuery(state)); }
  catch { /* about:srcdoc, file:// restringido… no hay barra que tocar */ }
}
// Mover un canal recoloca el resto: solo se mueve `online`, que es el resto,
// salvo cuando ya está a cero.
const setChannel = (key, v) => set({[key]:v});

/* ═══════════════ RENDER ═══════════════ */

const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (v === null || v === undefined || v === false) continue;
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};
const dot = (color, dashed) => h('span', {class:'dot',
  style:{background:dashed ? 'transparent' : color, border:dashed ? '1px dashed var(--muted-2)' : ''}});

function slider({id, label, value, r, readout, hint, onInput}){
  const fill = r.max > r.min ? (value-r.min)/(r.max-r.min)*100 : 0;
  const input = h('input', {type:'range', id, min:r.min, max:r.max, step:r.step, value,
    oninput:e => onInput(Number(e.target.value))});
  input.style.setProperty('--fill', fill + '%');
  return h('label', {class:'f', for:id},
    h('span', {class:'frow'}, h('span', {class:'fname'}, label), h('span', {class:'fval'}, readout)),
    input, h('p', {class:'hint'}, hint));
}

/* ── La propuesta, en cristiano ── */
function proposalCard(q, n, many){
  const {pricing, billing, bases} = q.inputs;
  const fee = pricing.fixed[billing === 'season' ? 'season' : 'monthly'];
  const per = billing === 'season' ? '/año' : '/mes';
  const fixedLine = q.lines.find(l => l.key === 'fixed');

  // De más barato a más caro: la lista se lee como una escalera, y una escalera
  // que no sube no se entiende. A igualdad de %, manda el orden de la factura.
  const rows = q.lines.filter(l => l.key !== 'fixed').slice().sort((a,b) => {
    const p = l => l.channel ? pricing.rates[l.channel].pct : 0;
    return p(a)-p(b) || q.lines.indexOf(a)-q.lines.indexOf(b);
  });

  const li = (name, color, rateTxt, free) => h('li', {},
    h('span', {style:{display:'flex', alignItems:'baseline', gap:'8px', minWidth:0}},
      dot(color), h('span', {class:'nm' + (free ? ' free' : '')}, name)),
    h('span', {class:'rate' + (free ? ' free' : '')}, rateTxt));

  return h('section', {class:'card pad',
      style:{boxShadow:many && n === 0 ? 'inset 3px 0 0 var(--accent)' : ''}},
    h('div', {class:'prop-head'},
      h('span', {class:'eyebrow'}, many ? `Propuesta ${PROPOSAL_LABELS[n]}` : 'Cómo te cobramos'),
      h('span', {style:{display:'flex', alignItems:'baseline', gap:'7px', whiteSpace:'nowrap'}},
        h('strong', {class:'prop-total'}, money(q.total)),
        h('span', {class:'prop-per'}, `al año · ${pc(q.effectiveRate)}`))),
    h('ul', {class:'prop'},
      fixedLine && li('Cuota fija', LINE_COLOR.fixed,
        fee.first === 0 ? 'sin cuota'
          : bases > 1 ? `${money(fee.first)}${per} + ${money(fee.extra)} por base`
          : `${money(fee.first)}${per}`,
        fee.first === 0),
      rows.map(l => li(l.name, LINE_COLOR[l.key] || 'var(--muted)', l.rate, l.amount === 0))));
}

/* ── La comparativa ── */
function comparison(quotes){
  const all  = alternatives(quotes);
  const rows = alternatives(quotes, hidden);
  const peak = Math.max(...rows.map(r => r.total), 1);

  // Un concepto apagado deja de tener importe en todas las barras, así que
  // saldría de `present`: se le suma lo oculto para que su botón siga ahí.
  const present = new Set(all.flatMap(r => r.lines.filter(l => l.amount > 0).map(l => l.key)));
  const legend = h('div', {class:'legend'},
    LEGEND_ORDER.filter(k => present.has(k) || hidden.includes(k)).map(k => {
      const off = hidden.includes(k);
      return h('button', {type:'button', 'data-off':off, 'aria-pressed':!off,
        title:off ? 'Volver a contarlo' : 'Quitarlo de la comparación',
        onclick:() => { hidden = off ? hidden.filter(x => x !== k) : [...hidden, k]; render(); }},
        dot(LINE_COLOR[k] || 'var(--muted)', off), LEGEND_LABEL[k] || k);
    }));

  const row = r => h('div', {class:'vs-row', 'data-solnow':r.isSolnow},
    h('span', {class:'vs-name'}, r.name),
    h('div', {class:'vs-bar', style:{width:(r.total/peak*100) + '%', minWidth:'4px'}},
      r.lines.filter(l => l.amount > 0).map(l => {
        const share = r.total > 0 ? l.amount/r.total*100 : 0;
        return h('div', {class:'seg-bar', 'data-external':EXTERNAL.has(l.key),
          title:`${r.name} · ${l.name} ${l.rate}: ${money(l.amount)}`,
          style:{width:share + '%', background:LINE_COLOR[l.key] || 'var(--muted)'}},
          share >= 22 ? money(l.amount) : '');
      })),
    h('strong', {class:'vs-total', style:{color:r.isSolnow ? 'var(--accent)' : 'var(--fg)'}}, money(r.total)),
    h('div', {class:'vs-caps'}, r.capabilities.map(c => h('span', {class:'cap', 'data-on':c.on},
      h('span', {style:{color:c.on ? 'var(--ok)' : 'inherit', fontWeight:'700'}}, c.on ? '✓' : '–'), c.label))));

  return h('section', {class:'card pad stack'},
    h('h2', {}, 'Lo mismo, con las alternativas'),
    legend,
    hidden.length > 0 && h('p', {class:'note'},
      `Estás comparando sin ${hidden.length === 1 ? 'un concepto' : hidden.length + ' conceptos'}. ` +
      'Vuelve a pulsar en la leyenda para contarlo otra vez.'),
    h('div', {}, rows.map(row)),
    h('div', {class:'stack', style:{gap:'4px'}},
      rows.map(r => h('p', {class:'foot'}, `${r.name} · ${r.note}`))));
}

/* ── El desglose ── */
function breakdown(q){
  const bar = h('div', {class:'bd-bar'},
    q.lines.filter(l => l.amount > 0).map(l => {
      const share = q.total > 0 ? l.amount/q.total*100 : 0;
      // Un tramo estrecho suelta primero el nombre y luego el %, y se queda con
      // el importe. La tabla de abajo lo dice todo igualmente.
      const room = share >= 17 ? 'full' : share >= 8 ? 'amount' : 'none';
      return h('div', {class:'seg-bar bd-seg', 'data-external':EXTERNAL.has(l.key),
        title:`${l.name} · ${l.rate}: ${money(l.amount)}`,
        style:{width:share + '%', background:LINE_COLOR[l.key] || 'var(--muted)'}},
        room === 'full'   ? h('span', {style:{fontSize:'11px', opacity:.85}}, `${l.name} · ${l.rate}`) : null,
        room !== 'none'   ? h('strong', {style:{fontSize:'15px'}}, money(l.amount)) : null,
        room === 'full'   ? h('span', {style:{fontSize:'10.5px', opacity:.8}}, pc100(share)) : null);
    }));

  const tr = l => {
    // Los costes derivados ya no existen: cada canal es una fila y la columna
    // de facturación suma exactamente lo que factura el operador.
    const free = l.amount === 0;
    return h('tr', {class:free ? 'free' : ''},
      h('th', {scope:'row'}, dot(free ? 'transparent' : (LINE_COLOR[l.key] || 'var(--muted)'), free),
        h('span', {style:{marginLeft:'8px'}}, l.name)),
      h('td', {}, l.base === null ? '—' : money(l.base)),
      h('td', {}, l.rate),
      h('td', {style:{fontWeight:'600'}}, money(l.amount)),
      h('td', {}, q.total > 0 && !free ? pc100(l.amount/q.total*100) : '—'));
  };

  return h('section', {class:'card pad stack'},
    h('div', {}, h('h2', {}, 'De qué se compone'),
      h('p', {class:'sub'}, 'Una cuota por base y un escalón por canal. Cada escalón es una cosa más que hacemos por esa reserva.')),
    bar,
    h('div', {class:'tbl-wrap'}, h('table', {},
      h('thead', {}, h('tr', {}, ['Concepto','Facturación','Tarifa','Coste/año','% del total']
        .map((t, n) => h('th', {scope:'col', style:{textAlign:n ? 'right' : 'left'}}, t)))),
      h('tbody', {}, q.lines.map(tr)),
      h('tfoot', {}, h('tr', {},
        h('th', {scope:'row'}, 'Total'),
        h('td', {}, money(q.inputs.revenue)),
        h('td', {}, pc(q.effectiveRate)),
        h('td', {style:{color:'var(--accent)', fontWeight:'600'}}, money(q.total)),
        h('td', {}, '100%'))))));
}

/* ── El calendario ── */
function scheduleBlock(q){
  const season = q.inputs.billing === 'season';
  const peak = Math.max(...q.schedule.map(m => m.total), 1);
  const free = q.schedule.filter(m => m.free).map(m => m.label);
  return h('section', {class:'card pad stack'},
    h('div', {}, h('h2', {}, 'Cuándo lo pagas'),
      h('p', {class:'sub', style:{color:season ? 'var(--accent)' : ''}},
        season ? 'De noviembre a febrero no pagas cuota.' : 'Pagas lo mismo en enero que en agosto.')),
    h('div', {},
      h('div', {class:'months'}, q.schedule.map(m => h('div', {class:'mcol'},
        m.fixed > 0 && h('div', {class:'mbar', style:{height:(m.fixed/peak*100) + '%', background:LINE_COLOR.fixed}}),
        h('div', {class:'mbar', style:{height:(m.variable/peak*100) + '%',
          background:m.free ? 'var(--accent-bg)' : 'var(--accent-2)',
          border:m.free ? '1px dashed var(--accent-2)' : '', borderBottom:m.free ? '0' : '',
          borderRadius:m.fixed > 0 ? '0' : '4px 4px 0 0'}})))),
      h('div', {class:'mlabels'}, q.schedule.map(m =>
        h('div', {class:'mlabel' + (m.free ? ' free' : '')}, m.label)))),
    season && free.length > 0 && h('p', {class:'sub'},
      `${free.join(', ')}: solo comisión de lo que vendas, sin cuota.`),
    h('p', {class:'foot'},
      `Reparto sobre el perfil «${SEASONALITY[q.inputs.seasonality].label}» que has elegido. Cambiarlo mueve el reparto, nunca el total del año.`));
}

function render(){
  const err = integrityError(state.pricing);
  const controls = document.getElementById('controls');
  const results  = document.getElementById('results');
  controls.replaceChildren(renderControls());

  if (err){
    // Antes que enseñar un descuento negativo o un incentivo invertido, la
    // calculadora se calla y avisa.
    results.replaceChildren(h('div', {class:'card pad'}, h('p', {class:'warn'}, err)));
    return;
  }

  const quotes = state.pricingB
    ? [computeQuote(state, hidden), computeQuote({...state, pricing:state.pricingB}, hidden)]
    : [computeQuote(state, hidden)];
  const q = quotes[Math.min(shown, quotes.length - 1)];

  results.replaceChildren(
    h('div', {class:'proposals'}, quotes.map((x, n) => proposalCard(x, n, quotes.length > 1))),
    comparison(quotes),
    quotes.length > 1 && h('div', {class:'seg', style:{gridTemplateColumns:'1fr 1fr'}},
      quotes.map((x, n) => h('button', {type:'button', 'aria-pressed':shown === n,
        onclick:() => { shown = n; render(); }},
        `Propuesta ${PROPOSAL_LABELS[n]} · ${money(x.total)}`))),
    breakdown(q),
    scheduleBlock(q));
}

render();
</script>
</body>
</html>
